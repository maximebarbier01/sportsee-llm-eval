[project]
name = "sportsee-llm-eval"
version = "1.1.0"
description = "Évaluation et extension d'un assistant RAG pour SportSee"
authors = [
    {name = "Maxime Barbier",email = "maximebarbier57@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Dépendances principales : faire tourner l'assistant et son API (toutes importées par src/,
# sauf mention contraire)
dependencies = [
    "langchain-community (==0.4.1)",  # figé : ragas 0.4.3 importe un module retiré en 0.4.2
    "langchain-mistralai (>=1.1.6,<2.0.0)",
    "mistralai (>=2.10.1,<3.0.0)",
    "faiss-cpu (>=1.15.1,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "logfire[fastapi] (>=5.2.0,<6.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",  # moteur de lecture Excel utilisé par pandas.read_excel
    "sqlalchemy (>=2.1.0,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "pydantic-ai-slim[logfire,mistral] (>=2.50.0,<3.0.0)",
    "fastapi (>=0.159.1,<0.160.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "langchain-core (>=1.6.5,<2.0.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
# Évaluation RAGAS et graphiques du rapport
eval = [
    "ragas (>=0.4.3,<0.5.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "instructor (>=1.14)",  # dépendance de ragas, version minimale imposée (sinon 0.4.x incompatible)
]
# Tests, qualité du code et export du rapport
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.9,<0.17.0)",
    "black (>=26.5.1,<27.0.0)",
    "mistune (>=3.3.4,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
# Optionnel, non requis par les scripts : exploration dans Jupyter
notebook = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]
# Optionnel, non requis par les scripts : ré-indexer le prototype d'origine (OCR EasyOCR)
ingestion = [
    "pymupdf (>=1.28.2,<2.0.0)",
    "easyocr (>=1.7.2,<2.0.0)",
    "pypdf (>=6.19.0,<7.0.0)",
    "python-docx (>=1.2.0,<2.0.0)"
]

[tool.logfire]
# tests et scripts sans configuration Logfire : pas d'avertissement
ignore_no_config = true
